# Azure DevOps CI Pipeline - Q1: Build, Pack, and Push NuGet Package
# Store this file at the root of your GitHub repo

trigger:
  branches:
    include:
      - main

pool:
  name: Default          # <-- Name of your Self-Hosted Agent Pool

variables:
  buildConfiguration: 'Release'
  # Format: 'ProjectName/FeedName' for project-scoped feeds
  # OR just 'FeedName' for organization-scoped feeds
  # Find your feed name in Azure DevOps > Artifacts > your feed > Connect to feed
  feedName: 'StringExtensions/StringExtensionsFeed'

steps:
  # Step 1: Restore NuGet dependencies
  - task: DotNetCoreCLI@2
    displayName: 'Restore NuGet packages'
    inputs:
      command: 'restore'
      projects: '**/StringExtensions.csproj'

  # Step 2: Build the class library
  - task: DotNetCoreCLI@2
    displayName: 'Build StringExtensions library'
    inputs:
      command: 'build'
      projects: '**/StringExtensions.csproj'
      arguments: '--configuration $(buildConfiguration) --no-restore'

  # Step 3: Run unit tests
  - task: DotNetCoreCLI@2
    displayName: 'Run unit tests'
    inputs:
      command: 'test'
      projects: '**/StringExtensions.Tests.csproj'
      arguments: '--configuration $(buildConfiguration)'

  # Step 4: Pack the NuGet package
  - task: DotNetCoreCLI@2
    displayName: 'Pack NuGet package'
    inputs:
      command: 'pack'
      packagesToPack: '**/StringExtensions.csproj'
      configuration: '$(buildConfiguration)'
      versioningScheme: 'off'

  # Step 5: Push the NuGet package to Azure Artifacts Feed
  - task: DotNetCoreCLI@2
    displayName: 'Push NuGet package to Azure Artifacts'
    inputs:
      command: 'push'
      packagesToPush: '$(Build.ArtifactStagingDirectory)/**/*.nupkg'
      nuGetFeedType: 'internal'
      publishVstsFeed: '$(feedName)'
      allowPackageConflicts: true
